name: Daily Social Revenue Sprint

on:
  schedule:
    # Runs at 12:00 UTC (5:30 PM IST) to guarantee completion before the 7:05 PM IST CEO Daily Briefing
    # (even with up to 60-minute GitHub Actions runner queue jitter)
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Triggered on exact minute by cron-job.org / Vercel cron bridge or manual 1-click run
    inputs:
      force:
        description: 'Bypass 16h cooldown guard (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  dispatch:
    name: Render & Publish Infinite Daily 2D Reel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Edge-TTS & Verify FFmpeg + Chrome
        run: |
          python3 -m pip install --quiet --upgrade --break-system-packages edge-tts || python3 -m pip install --quiet --upgrade edge-tts
          which edge-tts ffmpeg google-chrome || true
          ffmpeg -version | head -n 1

      - name: Generate Fresh 2D Reel & Publish to Social Channels
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL || secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY || secrets.GOOGLE_PRIVATE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          GROWTH_OS_REPORT_EMAIL: ${{ secrets.GROWTH_OS_REPORT_EMAIL }}
          NEXT_PUBLIC_APP_URL: https://www.fsidigital.ca
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            npx tsx scripts/run-infinite-daily-video-dispatch.ts --force
          else
            npx tsx scripts/run-infinite-daily-video-dispatch.ts
          fi
