<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 1080px;
    height: 1920px;
    margin: 0;
    padding: 0;
    background: transparent !important;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .slide-container {
    width: 1080px;
    height: 1920px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 220px 60px 280px 60px; /* Respecting Reels/Shorts safe zones */
    box-sizing: border-box;
  }

  /* Glassmorphism HUD Card */
  .glass-card {
    background: linear-gradient(155deg, rgba(15, 23, 42, 0.90) 0%, rgba(2, 6, 23, 0.95) 100%);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-radius: 44px;
    padding: 64px 56px;
    box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.85),
                0 0 50px rgba(220, 38, 38, 0.20),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
    display: flex;
    flex-direction: column;
    gap: 36px;
    position: relative;
    overflow: hidden;
  }

  /* Subtle ambient glow inside card */
  .card-glow {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(220, 38, 38, 0.25) 0%, transparent 70%);
    top: -150px;
    right: -150px;
    pointer-events: none;
  }

  /* Top Badge */
  .badge-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  .pill-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, #DC2626 0%, #991B1B 100%);
    color: #ffffff;
    font-size: 28px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 12px 28px;
    border-radius: 9999px;
    box-shadow: 0 6px 20px rgba(220, 38, 38, 0.35);
  }

  .counter-badge {
    font-size: 32px;
    font-weight: 800;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 0.05em;
  }

  /* Titles */
  .title-intro {
    font-family: 'Playfair Display', serif;
    font-size: 96px;
    font-weight: 900;
    color: #FFFFFF;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }

  .title-stat {
    font-size: 72px;
    font-weight: 900;
    color: #FFFFFF;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }

  .subtitle {
    font-size: 42px;
    font-weight: 600;
    color: #94A3B8;
    line-height: 1.35;
  }

  /* Highlight Amount Box */
  .amount-box {
    background: rgba(255, 255, 255, 0.06);
    border: 1.5px solid rgba(255, 255, 255, 0.14);
    border-radius: 32px;
    padding: 36px 40px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .amount-label {
    font-size: 26px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #94A3B8;
  }

  .amount-value {
    font-family: 'Playfair Display', serif;
    font-size: 105px;
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(135deg, #FDE047 0%, #F59E0B 50%, #D97706 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Emerald variant for tax credits */
  .amount-emerald {
    background: linear-gradient(135deg, #6EE7B7 0%, #10B981 50%, #059669 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Description & Checkpoints */
  .desc-text {
    font-size: 40px;
    font-weight: 500;
    color: #E2E8F0;
    line-height: 1.45;
  }

  .features-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 34px;
    font-weight: 600;
    color: #CBD5E1;
  }

  .feature-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(16, 185, 129, 0.2);
    color: #10B981;
    font-size: 26px;
    font-weight: 800;
  }

  /* Footer inside card */
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 32px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    margin-top: 10px;
  }

  .footer-brand {
    font-size: 32px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: 0.05em;
  }

  .footer-cta {
    background: #DC2626;
    color: #FFFFFF;
    font-size: 30px;
    font-weight: 800;
    padding: 14px 32px;
    border-radius: 18px;
    letter-spacing: 0.03em;
    box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
  }

  /* CTA Slide Special */
  .cta-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 36px;
  }

  .cta-big-url {
    font-size: 64px;
    font-weight: 900;
    color: #FFFFFF;
    background: rgba(255, 255, 255, 0.08);
    border: 2px dashed rgba(220, 38, 38, 0.6);
    border-radius: 28px;
    padding: 24px 48px;
    letter-spacing: 0.04em;
    margin-top: 10px;
  }
</style>
</head>
<body>
<!-- Slide content injected here -->
</body>
</html>
