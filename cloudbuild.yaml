steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_PAYPAL_CLIENT_ID=${_NEXT_PUBLIC_PAYPAL_CLIENT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_CONSULTATION_PAYPAL_CLIENT_ID=${_NEXT_PUBLIC_CONSULTATION_PAYPAL_CLIENT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_PAYPAL_PLAN_ID=${_NEXT_PUBLIC_PAYPAL_PLAN_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_PAYPAL_CURRENCY=${_NEXT_PUBLIC_PAYPAL_CURRENCY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_GA_MEASUREMENT_ID=${_NEXT_PUBLIC_GA_MEASUREMENT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_ADSENSE_PUBLISHER_ID=${_NEXT_PUBLIC_ADSENSE_PUBLISHER_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_ADSENSE_AUTO_ADS=${_NEXT_PUBLIC_ADSENSE_AUTO_ADS}'
      - '--build-arg'
      - 'NEXT_PUBLIC_ADSENSE_HEADER_AD=${_NEXT_PUBLIC_ADSENSE_HEADER_AD}'
      - '--build-arg'
      - 'NEXT_PUBLIC_ADSENSE_SIDEBAR_AD=${_NEXT_PUBLIC_ADSENSE_SIDEBAR_AD}'
      - '--build-arg'
      - 'NEXT_PUBLIC_ADSENSE_IN_CONTENT_HORIZONTAL=${_NEXT_PUBLIC_ADSENSE_IN_CONTENT_HORIZONTAL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_ADSENSE_IN_CONTENT_RECTANGLE=${_NEXT_PUBLIC_ADSENSE_IN_CONTENT_RECTANGLE}'
      - '--build-arg'
      - 'NEXT_PUBLIC_ADSENSE_BLOG_PARAGRAPH_2=${_NEXT_PUBLIC_ADSENSE_BLOG_PARAGRAPH_2}'
      - '--build-arg'
      - 'NEXT_PUBLIC_ADSENSE_BLOG_PARAGRAPH_7=${_NEXT_PUBLIC_ADSENSE_BLOG_PARAGRAPH_7}'
      - '-t'
      - '${_IMAGE}'
      - '.'

images:
  - '${_IMAGE}'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _IMAGE: 'us-central1-docker.pkg.dev/$PROJECT_ID/fsi-digital/web:latest'
  _NEXT_PUBLIC_APP_URL: 'https://www.fsidigital.ca'
  _NEXT_PUBLIC_SITE_URL: 'https://www.fsidigital.ca'
  _NEXT_PUBLIC_PAYPAL_CLIENT_ID: ''
  _NEXT_PUBLIC_CONSULTATION_PAYPAL_CLIENT_ID: ''
  _NEXT_PUBLIC_PAYPAL_PLAN_ID: ''
  _NEXT_PUBLIC_PAYPAL_CURRENCY: 'USD'
  _NEXT_PUBLIC_GA_MEASUREMENT_ID: ''
  _NEXT_PUBLIC_ADSENSE_PUBLISHER_ID: ''
  _NEXT_PUBLIC_ADSENSE_AUTO_ADS: ''
  _NEXT_PUBLIC_ADSENSE_HEADER_AD: ''
  _NEXT_PUBLIC_ADSENSE_SIDEBAR_AD: ''
  _NEXT_PUBLIC_ADSENSE_IN_CONTENT_HORIZONTAL: ''
  _NEXT_PUBLIC_ADSENSE_IN_CONTENT_RECTANGLE: ''
  _NEXT_PUBLIC_ADSENSE_BLOG_PARAGRAPH_2: ''
  _NEXT_PUBLIC_ADSENSE_BLOG_PARAGRAPH_7: ''
